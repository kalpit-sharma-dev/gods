name: PR Checks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_go_ci: ${{ steps.filter.outputs.go_ci }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect relevant file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go_ci:
              - "**/*.go"
              - "go.mod"
              - "go.sum"
              - ".github/workflows/**"
              - ".github/dependabot.yml"
              - ".github/CODEOWNERS"

  pr-checks:
    needs: changes
    uses: ./.github/workflows/go-ci-reusable.yml
    with:
      min_coverage: 30
      run_go_ci: ${{ needs.changes.outputs.run_go_ci == 'true' }}
      pr_mode: true
      # Tune these patterns per repository layout.
      run_fuzz: true
      # Tune fuzz packages/timeouts per repository.
      fuzz_packages: |
        ./dataframe:FuzzJoinKeyDeterminism
        ./ndarray:FuzzReshapeRoundTrip
      run_govulncheck: true
      govuln_go_toolchain: go1.25.9
      run_gosec: true
      # Keep excludes minimal and project-specific.
      gosec_excludes: G115,G304,G306,G404
