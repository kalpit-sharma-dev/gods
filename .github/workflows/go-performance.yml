name: Performance Benchmarks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance:
    uses: ./.github/workflows/go-performance-reusable.yml
    with:
      benchmark_packages: "./dataframe ./ndarray"
      benchmark_pattern: "BenchmarkDataFrameFilter|BenchmarkDataFrameGroupByAgg|BenchmarkNDArrayAdd"
      max_regression_pct: 20
