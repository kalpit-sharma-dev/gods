name: Go Security

on:
  push:
    branches:
      - "**"
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/go-*.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  security:
    uses: ./.github/workflows/go-security-reusable.yml
    with:
      go_toolchain: "go1.25.9"
