name: Performance Benchmarks

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: perf-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run baseline benchmarks (base branch)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}"
          git checkout --detach "origin/${{ github.base_ref }}"
          go test ./dataframe ./ndarray -run=^$ -bench='BenchmarkDataFrameFilter|BenchmarkDataFrameGroupByAgg|BenchmarkNDArrayAdd' -benchmem -count=1 > /tmp/bench-base.txt

      - name: Run benchmarks (current branch)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git checkout --detach "${{ github.sha }}"
          fi
          go test ./dataframe ./ndarray -run=^$ -bench='BenchmarkDataFrameFilter|BenchmarkDataFrameGroupByAgg|BenchmarkNDArrayAdd' -benchmem -count=1 > /tmp/bench-head.txt

      - name: Compare benchmark results
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          parse_metric() {
            local file="$1"
            local bench="$2"
            local field="$3"
            awk -v b="$bench" -v f="$field" '
              $1 ~ ("^" b "(-[0-9]+)?$") {
                if (f=="ns") print $3;
                if (f=="bytes") print $5;
                if (f=="allocs") print $7;
              }
            ' "$file"
          }
          compare_one() {
            local bench="$1"
            local max_regress_pct="$2"
            local base_ns head_ns base_b head_b base_a head_a
            base_ns="$(parse_metric /tmp/bench-base.txt "$bench" ns)"
            head_ns="$(parse_metric /tmp/bench-head.txt "$bench" ns)"
            base_b="$(parse_metric /tmp/bench-base.txt "$bench" bytes)"
            head_b="$(parse_metric /tmp/bench-head.txt "$bench" bytes)"
            base_a="$(parse_metric /tmp/bench-base.txt "$bench" allocs)"
            head_a="$(parse_metric /tmp/bench-head.txt "$bench" allocs)"
            if [ -z "$base_ns" ] || [ -z "$head_ns" ] || [ -z "$base_b" ] || [ -z "$head_b" ] || [ -z "$base_a" ] || [ -z "$head_a" ]; then
              echo "Missing benchmark values for $bench"
              return 1
            fi
            awk -v bench="$bench" -v maxp="$max_regress_pct" \
              -v bns="$base_ns" -v hns="$head_ns" \
              -v bb="$base_b" -v hb="$head_b" \
              -v ba="$base_a" -v ha="$head_a" '
              function pct(old, now) {
                if (old == 0) return 0;
                return ((now-old)/old)*100.0;
              }
              BEGIN {
                pns=pct(bns,hns); pb=pct(bb,hb); pa=pct(ba,ha);
                printf "%s: ns/op %.2f%%, B/op %.2f%%, allocs/op %.2f%%\n", bench, pns, pb, pa;
                if (pns > maxp || pb > maxp || pa > maxp) {
                  printf "Regression too high for %s (threshold %.2f%%)\n", bench, maxp;
                  exit 1;
                }
              }'
          }
          compare_one "BenchmarkDataFrameFilter" 20
          compare_one "BenchmarkDataFrameGroupByAgg" 20
          compare_one "BenchmarkNDArrayAdd" 20

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            /tmp/bench-base.txt
            /tmp/bench-head.txt
